name: Regional Web Performance & DOM Telemetry Indexer

on:
  schedule:
    # Universal POSIX Cron: Runs continuously every 20 minutes 24/7 (100% Free & Unlimited on Public Repo)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration of continuous crawl in minutes'
        required: false
        default: '16'

concurrency:
  group: telemetry-index-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telemetry-index:
    name: Crawl & Audit Regional Web Telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Playwright & Telemetry Stack
        run: |
          python -m pip install --upgrade pip
          pip install playwright dnspython beautifulsoup4 requests urllib3
          python -m playwright install --with-deps chromium

      - name: 🚀 Run Maximum-Throttle Autonomous Supervisor (16 Minutes Continuous)
        run: |
          DURATION="${{ github.event.inputs.duration_minutes || 16 }}"
          echo "Initiating uncapped continuous crawl for $DURATION minutes..."
          python supervisor.py --duration-minutes "$DURATION"

      - name: 💾 Commit & Push Telemetry Data
        run: |
          git config --global user.name "Telemetry Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add telemetry_data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): automated regional benchmark sync [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break || sleep 5
            done
          else
            echo "Zero changes to commit."
          fi

      - name: 📤 Upload Telemetry Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-telemetry-latest
          path: telemetry_data/market_records.json
          retention-days: 14
