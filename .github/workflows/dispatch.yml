name: Multi-Mailbox Outbound Pitch Dispatcher

on:
  schedule:
    # 5 Prime US Contractor Business Windows (Mon-Fri) for 1,250 Emails/Day (Strict 25/Mailbox):
    # Pulse 1: 05:30 PM PKT (12:30 UTC = 08:30 AM EDT - Morning Start & Estimating)
    - cron: '30 12 * * 1-5'
    # Pulse 2: 07:30 PM PKT (14:30 UTC = 10:30 AM EDT / 08:30 AM CDT - Central Opening)
    - cron: '30 14 * * 1-5'
    # Pulse 3: 09:30 PM PKT (16:30 UTC = 12:30 PM EDT / 09:30 AM PDT - Lunch & West Coast)
    - cron: '30 16 * * 1-5'
    # Pulse 4: 11:30 PM PKT (18:30 UTC = 02:30 PM EDT / 11:30 AM PDT - Afternoon Review)
    - cron: '30 18 * * 1-5'
    # Pulse 5: 01:30 AM PKT (20:30 UTC = 04:30 PM EDT / 01:30 PM PDT - End-of-Day Quoting)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dispatch Mode (live sends real emails; preview simulates)'
        required: true
        type: choice
        options:
          - live
          - preview
        default: live
      batch_size:
        description: 'Maximum emails to dispatch in this batch (Default 250 for 1,250/day across 50 mailboxes at 25/mailbox)'
        required: false
        default: '250'
      ignore_hours:
        description: 'Bypass Working Hours Gate (true/false)'
        required: false
        default: 'false'

concurrency:
  group: dispatch-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch-pitches:
    name: Safe Multi-Subdomain SMTP Dispatcher & Follow-Up
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Scan IMAP for Replies & Auto-Quarantine Bounces
        env:
          SUBDOMAIN_MAIL_PASS: ${{ secrets.SUBDOMAIN_MAIL_PASS }}
          PASS_CONTACT: ${{ secrets.PASS_CONTACT }}
        run: |
          python cloud_reply_watcher.py || echo "IMAP scan finished with warnings."

      - name: 🔐 Validate Repository Secrets
        run: |
          if [ -z "${{ secrets.SUBDOMAIN_MAIL_PASS }}" ]; then
            echo "❌ CRITICAL: SUBDOMAIN_MAIL_PASS secret is not set in GitHub Repository Secrets!"
            echo "👉 Go to: Repo Settings -> Secrets and variables -> Actions -> Add SUBDOMAIN_MAIL_PASS"
          else
            echo "✅ Verified: SUBDOMAIN_MAIL_PASS secret is present in cloud environment."
          fi

      - name: 🚀 Run Autonomous Multi-Mailbox Dispatcher
        env:
          SUBDOMAIN_MAIL_PASS: ${{ secrets.SUBDOMAIN_MAIL_PASS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'live' }}"
          BATCH="${{ github.event.inputs.batch_size || '250' }}"
          IGNORE="${{ github.event.inputs.ignore_hours || 'false' }}"
          echo "Initiating Multi-Mailbox Dispatch in [$MODE] mode with batch limit [$BATCH]..."
          
          CMD="python cloud_dispatcher.py --batch-size $BATCH"
          if [ "$MODE" = "live" ]; then
            CMD="$CMD --live"
          else
            CMD="$CMD --preview"
          fi
          if [ "$IGNORE" = "true" ]; then
            CMD="$CMD --ignore-hours"
          fi
          
          eval $CMD

      - name: 💾 Commit & Push All Telemetry Ledgers & Dashboards
        if: always()
        run: |
          git config --global user.name "Telemetry Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add telemetry_data/sent_ledger.json \
                  telemetry_data/followup_pipeline.json \
                  telemetry_data/quarantine_archive.json \
                  telemetry_data/daily_mailbox_usage.json \
                  telemetry_data/followup_dashboard.html \
                  telemetry_data/replies_inbox.json \
                  telemetry_data/approved_pitches.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(dispatcher): automated sync for sent, followups, quarantine & dashboard [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break || sleep 5
            done
          else
            echo "Zero ledger changes to commit."
          fi

      - name: 📤 Upload Followup Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-dashboard-latest
          path: telemetry_data/followup_dashboard.html
          retention-days: 14
