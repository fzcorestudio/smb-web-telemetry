name: Multi-Mailbox Outbound Pitch Dispatcher

on:
  schedule:
    # Runs Daily at 06:30 PM PKT (13:30 UTC), which is 09:30 AM EDT (peak US contractor open window)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dispatch Mode (live sends real emails; preview simulates)'
        required: true
        type: choice
        options:
          - preview
          - live
        default: preview
      batch_size:
        description: 'Maximum emails to dispatch in this batch (Max 100)'
        required: false
        default: '50'
      ignore_hours:
        description: 'Bypass Working Hours Gate (true/false)'
        required: false
        default: 'false'

concurrency:
  group: dispatch-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch-pitches:
    name: Safe Multi-Subdomain SMTP Dispatcher & Follow-Up
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Scan IMAP for Lead Replies & Auto-Stop Sequences
        env:
          SUBDOMAIN_MAIL_PASS: ${{ secrets.SUBDOMAIN_MAIL_PASS }}
        run: |
          python cloud_reply_watcher.py || echo "IMAP scan finished with warnings."

      - name: 🚀 Run Autonomous Multi-Mailbox Dispatcher
        env:
          SUBDOMAIN_MAIL_PASS: ${{ secrets.SUBDOMAIN_MAIL_PASS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'preview' }}"
          BATCH="${{ github.event.inputs.batch_size || '50' }}"
          IGNORE="${{ github.event.inputs.ignore_hours || 'false' }}"
          echo "Initiating Multi-Mailbox Dispatch in [$MODE] mode with batch limit [$BATCH]..."
          
          CMD="python cloud_dispatcher.py --batch-size $BATCH"
          if [ "$MODE" = "live" ]; then
            CMD="$CMD --live"
          else
            CMD="$CMD --preview"
          fi
          if [ "$IGNORE" = "true" ]; then
            CMD="$CMD --ignore-hours"
          fi
          
          eval $CMD

      - name: 💾 Commit & Push All Telemetry Ledgers & Dashboards
        run: |
          git config --global user.name "Telemetry Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add telemetry_data/sent_ledger.json \
                  telemetry_data/followup_pipeline.json \
                  telemetry_data/quarantine_archive.json \
                  telemetry_data/daily_mailbox_usage.json \
                  telemetry_data/followup_dashboard.html \
                  telemetry_data/replies_inbox.json \
                  telemetry_data/approved_pitches.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(dispatcher): automated sync for sent, followups, quarantine & dashboard [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break || sleep 5
            done
          else
            echo "Zero ledger changes to commit."
          fi

      - name: 📤 Upload Followup Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-dashboard-latest
          path: telemetry_data/followup_dashboard.html
          retention-days: 14
